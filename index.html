<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#FAF8F4" />
    <!--app-head-->
    <link rel="preload" href="/fonts/marcellus-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <script>
      // Attiva le animazioni prima del primo disegno; se il JavaScript non parte, le toglie.
      document.documentElement.classList.add('js');
      setTimeout(function () {
        if (!window.__vm) document.documentElement.classList.remove('js');
      }, 3000);
    </script>

    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
